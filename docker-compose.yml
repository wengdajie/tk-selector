services:
  tk-selector:
    build: .
    image: tk-selector:1.11.1
    container_name: tk-selector
    restart: unless-stopped
    ports:
      - "8899:8080"
    environment:
      TZ: Asia/Shanghai
      # 群晖：控制面板 → 用户 → 你的账号 → 查看 UID/GID（首个用户通常是 1026/100）
      PUID: "1026"
      PGID: "100"
      SCAN_DIR: /watch
      SCAN_MODE: copy          # copy 复制进库 | move 移动（投递目录会被清空）| link
      SCAN_INTERVAL: "300"     # 秒；0 = 关闭定时扫描，只手动触发
      ADMIN_NAME: 管理员
      # ACCESS_CODE: "改这里"  # 可选：设置后新增/删除成员需要口令
      MAX_UPLOAD_MB: "8192"
      # ---- AI 脚本拆解（出厂默认值；部署后管理员在「系统设置」界面里改，立即生效）----
      AI_ENABLED: "1"
      AI_BASE_URL: https://api.grsai.com/v1
      AI_API_KEY: ""          # 可留空：部署后在网页「系统设置」里填
      AI_MODEL: gpt-4o
      AI_FRAMES: "6"
      AI_TIMEOUT_MS: "300000"   # 单次拆解超时；慢模型可调大
      # PROXY_ENABLED: "1"       # 播放版转码（HEVC→H.264）；低功耗 NAS 想省 CPU 可设 0
      # ---- 群通知（出厂默认值；部署后管理员在「系统设置」界面里改，立即生效）----
      NOTIFY_ENABLED: "1"
      NOTIFY_TYPE: wecom       # wecom | feishu | dingtalk
      NOTIFY_URL: ""           # 群机器人 Webhook 地址；可部署后在网页里填
      NOTIFY_SECRET: ""        # 钉钉/飞书「加签」密钥；企业微信机器人留空
      NOTIFY_ON_UPLOAD: "1"
      NOTIFY_ON_COMMENT: "1"
      # NOTIFY_PUBLIC_BASE: https://tk.example.com   # 公网地址：钉钉缩略图卡片需要
    volumes:
      - ./data:/data
      # 拍摄投递目录：群晖共享文件夹真实路径，只读挂载
      - /volume1/拍摄投递:/watch:ro
